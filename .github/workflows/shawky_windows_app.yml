# Builds the Shawky WhatsApp Windows installer (desktop/shawky-windows, Tauri + WebView2).
name: Shawky Windows app

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/shawky-windows/**'
      - '.github/workflows/shawky_windows_app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/shawky-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/shawky-windows/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/shawky-windows/src-tauri
      - run: npm ci
      - run: cargo test --locked
        working-directory: desktop/shawky-windows/src-tauri
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Shawky-WhatsApp-Setup
          path: desktop/shawky-windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
